name: Collegamenti → aggiornati

on:
  schedule:
    - cron: "41 3 * * *"       # una volta al giorno (04:41 ora italiana)
  workflow_dispatch: {}        # e quando vuoi, dal pulsante "Run workflow"

permissions:
  contents: write
  pages: write

concurrency:
  group: collegamenti
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Segue i profili che si sono trasferiti
        run: python scripts/flp_collegamenti.py

      - name: Pubblica se qualcosa è cambiato
        id: commit
        run: |
          git config user.name "danielemingucci-stack"
          git config user.email "danielemingucci-stack@users.noreply.github.com"
          git add _data/cv.yml
          if git diff --cached --quiet; then
            echo "Nessun trasloco."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Collegamenti: indirizzi aggiornati dopo un trasloco"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Aggiorna il sito
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
