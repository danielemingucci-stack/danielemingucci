<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F7F7F5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Jost:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F7F7F5;color:#121212;font-family:Jost,sans-serif;font-size:16px}
a{color:#121212}a:hover{color:#000}
img{display:block;max-width:100%;height:auto}
.wrap{max-width:1360px;margin:0 auto;padding:0 24px}
.testata{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:16px;padding:28px 24px;max-width:1360px;margin:0 auto}
.testata .nome{text-decoration:none;font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;letter-spacing:.02em}
.testata nav{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.testata nav a{padding:12px 10px;color:#57564F}
.testata nav a.qui{color:#121212;box-shadow:inset 0 -1px 0 #121212}
.testata svg{display:block}
.etichetta{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#57564F}
.scritto{max-width:720px;margin:0 auto;padding:72px 24px 96px}
.scritto h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:64px;line-height:1.05;margin:20px 0 0}
.scritto .copertina{margin:48px 0 0;width:100%;max-height:520px;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.testo{margin-top:48px;font-family:'Cormorant Garamond',serif;font-size:23px;line-height:1.6}
.testo p{margin:0 0 1.1em}
.testo h2,.testo h3{font-weight:400;font-size:32px;line-height:1.2;margin:1.6em 0 .6em}
.testo blockquote{margin:1.4em 0;padding-left:24px;border-left:1px solid #121212;font-style:italic;color:#3A3935}
.testo img{margin:2em 0;filter:grayscale(1) contrast(1.05)}
.testo a{text-underline-offset:3px}
.testo hr{border:0;border-top:1px solid #DCDBD6;margin:2.4em 0}
.origine{margin-top:40px;font-size:13px;color:#57564F}
.sequenza{display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;max-width:720px;margin:0 auto;padding:40px 24px 64px;border-top:1px solid #DCDBD6}
.sequenza a{text-decoration:none;max-width:320px}
.sequenza .titolo{display:block;margin-top:8px;font-family:'Cormorant Garamond',serif;font-size:26px;line-height:1.2}
.elenco a{display:flex;flex-wrap:wrap;gap:8px 32px;justify-content:space-between;align-items:baseline;padding:32px 0;border-bottom:1px solid #DCDBD6;text-decoration:none}
.elenco .titolo{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:48px;line-height:1.05;flex:999 1 420px}
.elenco .quando{font-size:13px;color:#57564F}
.elenco .attacco{flex:0 0 100%;margin:0;font-size:15px;line-height:1.65;color:#57564F;max-width:720px}
.piede{background:#121212;color:#A3A29E;font-size:12px}
.piede .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;padding-top:32px;padding-bottom:40px}
.piede a{color:#A3A29E;padding:10px 0}
@media (max-width:760px){.scritto h1{font-size:44px}.testo{font-size:21px}.elenco .titolo{font-size:34px}}
</style>
