<details class="li-segui">
  <summary class="li-btn pieno">{{ t.segui }}</summary>
  <div class="li-segui-box">
    <p class="titolo">{{ t.segui_titolo }}</p>
    {%- if site.newsletter_buttondown and site.newsletter_buttondown != "" %}
    <form action="https://buttondown.com/api/emails/embed-subscribe/{{ site.newsletter_buttondown }}" method="post" target="_blank">
      <label for="segui-email-{{ include.id | default: 'p' }}">{{ t.segui_email }}</label>
      <input id="segui-email-{{ include.id | default: 'p' }}" type="email" name="email" required autocomplete="email" placeholder="{{ t.segui_esempio }}">
      <input type="hidden" name="tag" value="danielemingucci.com">
      <button class="li-btn pieno" type="submit">{{ t.segui_iscriviti }}</button>
    </form>
    <p class="nota">{{ t.segui_nota }}</p>
    {%- else %}
    <p class="nota">{{ t.segui_scrivimi }}</p>
    <a class="li-btn pieno" href="mailto:dacco@mng-crea.com?subject={{ t.segui_oggetto }}&amp;body={{ t.segui_corpo }}">{{ t.segui_iscrivimi }}</a>
    {%- endif %}
    <p class="nota"><a href="{% if L == "en" %}/feed/en/scritti.xml{% else %}/feed/scritti.xml{% endif %}">{{ t.segui_rss }}</a></p>
  </div>
</details>
