{%- assign headline = ruolo_base -%}
<div class="li-card">
  <div class="li-cover mini"></div>
  <div class="li-mini">
    <img class="li-avatar" src="/img/avatar.jpg" alt="">
    <a class="nome" href="{{ base }}/curriculum/">Daniele Mingucci</a>
    <p>{{ headline | escape }}</p>
    {%- if cv.luogo and cv.luogo != "" %}<p>{{ cv.luogo | escape }}</p>{% endif %}
    <div class="li-azioni" style="justify-content: center">{% include segui.html id="biglietto" %}</div>
  </div>
  <a class="li-piede" href="{{ base }}/curriculum/">{{ t.vedi_profilo }}</a>
</div>
