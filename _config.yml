title: Daniele Mingucci
description: Inventore, imprenditore, autore. Scritti, startup, mare, linguaggi.
url: https://www.danielemingucci.com
lang: it
timezone: Europe/Rome

# Ogni scritto vive in /scritti/titolo-dello-scritto/
permalink: /scritti/:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Gli scritti usano da soli l'impaginazione "post": non serve scriverlo in ogni file
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: en
    values:
      layout: post
      lang: en
  - scope:
      path: "en"
    values:
      lang: en

# Le traduzioni inglesi degli scritti stanno in _en/ e vivono in /en/scritti/titolo/
collections:
  en:
    output: true

# Feed per chi segue: /feed.xml (tutto) e /feed/scritti.xml (solo gli scritti, per le email)
plugins:
  - jekyll-feed
  - jekyll-sitemap
feed:
  categories:
    - scritti
  collections:
    en:
      categories:
        - scritti

# Nome utente Buttondown per l'iscrizione via email (vuoto = "Segui" apre una mail a Daniele)
newsletter_buttondown: ""

exclude:
  - README.md
  - scripts
  - "free-linkable-profile/kit/*.md"
  - free-linkable-profile/kit/LICENSE

# Modulo di contatto della home. Per riceverlo direttamente nella tua casella:
# vai su web3forms.com, inserisci la tua email, e incolla qui la chiave che ti arriva.
# Finché è vuota, "Invia" apre il programma di posta con il messaggio già scritto.
contatti:
  web3forms_key: ""

# Home: scritto mostrato in evidenza (nome del file in _posts, senza estensione).
# Lascia vuoto per mostrare sempre l'ultimo scritto pubblicato.
home_scritto: "2026-11-09-lavoro-opera-azione-mi-ha-un-po-scandalizzato"
